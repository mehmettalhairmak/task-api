services:
    postgres:
        image: postgres:16-alpine
        container_name: task_api_postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: nest_user
            POSTGRES_PASSWORD: nest_password
            POSTGRES_DB: task_api_db
        ports:
            - '5432:5432'
        volumes:
            - task_api_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U nest_user -d task_api_db']
            interval: 5s
            timeout: 6s
            retries: 5
    api:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: task_api_app
        restart: unless-stopped
        ports:
            - '3000:3000'
        environment:
            PORT: 3000
            DB_HOST: postgres
            DB_PORT: 5432
            DB_USERNAME: nest_user
            DB_PASSWORD: nest_password
            DB_DATABASE: task_api_db
        depends_on:
            postgres:
                condition: service_healthy
volumes:
    task_api_pgdata:
